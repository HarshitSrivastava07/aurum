[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aurum-x"
version = "0.1.0"
description = "Local, adversarially verified commodity futures research"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "streamlit>=1.66.1,<2", "plotly>=6,<7", "requests>=2.32,<3",
  "certifi>=2026.10.19", "pillow>=13,<14",
  "duckdb>=1.2,<2", "pandas>=2.2,<3", "numpy>=2.1,<3", "pyarrow>=19,<24",
  "scipy>=1.15,<2", "statsmodels>=0.14,<1", "scikit-learn>=1.6,<2",
  "python-multipart>=0.0.20,<1", "xlrd>=2.0,<3", "openpyxl>=3.1,<4", "lxml>=5,<7",
  "httpx>=0.28,<1", "pytest>=8,<10", "hypothesis>=6,<7"
]

[tool.setuptools.packages.find]
include = ["backend*", "frontend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
